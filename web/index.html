<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>时间账</title><link rel="stylesheet" href="styles.css?v=23"></head><body>
<div class="shell"><header><div><p class="eyebrow">记录真实时间</p><h1>时间账</h1><p class="sub">看见时间的去向，重新选择生活。</p></div></header>
<nav aria-label="页面"><button data-view="today" class="selected">时间线</button><button data-view="week">本周</button><button data-view="month">本月</button><button data-view="categories">分类</button><button data-view="data">数据</button></nav>
<main id="main"></main></div>
<dialog id="editor"><form id="eventForm" method="dialog"><h2 id="formTitle">记录事件</h2><div class="category-picker"><span class="field-label">分类</span><select name="categoryId" class="visually-hidden" aria-label="已选分类" required></select><div id="categoryPicker" aria-label="选择分类"></div></div><label>开始时间<input name="start" type="datetime-local" step="1" required></label><label>结束时间<input name="end" type="datetime-local" step="1"></label><label class="check"><input name="running" type="checkbox">仍在进行中</label><label>备注<textarea name="note" rows="3" maxlength="300" placeholder="可记下这段时间发生了什么"></textarea></label><div id="editTools" class="edit-tools" hidden><button type="button" id="editSplit" class="quiet">从中间切换活动</button><button type="button" id="editMerge" class="quiet">合并相邻拆分段</button></div><p id="formError" class="error" role="alert"></p><div class="actions"><button type="button" id="cancelEdit" class="quiet">取消</button><button type="submit" class="primary">保存</button></div></form></dialog>
<dialog id="preview"><h2>确认相邻时间</h2><div id="previewText"></div><div class="actions"><button id="cancelPreview" class="quiet">返回修改</button><button id="confirmPreview" class="primary">确认保存</button></div></dialog>
<dialog id="splitDialog"><form id="splitForm"><h2>从中间切换活动</h2><p id="splitOriginal" class="meta"></p><label>从什么时候开始做下一件事<input id="splitAt" type="datetime-local" step="1" required></label><div class="category-picker"><span class="field-label">接下来做什么</span><select id="splitCategory" class="visually-hidden" aria-label="后一段已选分类" required></select><div id="splitCategoryPicker" aria-label="选择后一段分类"></div></div><label>后一段的结果或备注（可跳过）<textarea id="splitNote" rows="2" maxlength="300"></textarea></label><p id="splitSummary" class="meta"></p><p id="splitError" class="error" role="alert"></p><div class="actions"><button type="button" id="cancelSplit" class="quiet">取消</button><button type="submit" class="primary">保存两段</button></div></form></dialog>
<dialog id="mergeDialog"><h2>合并拆分段</h2><p id="mergeSummary"></p><p class="meta">两段必须连续、分类和备注一致；合并后恢复第一段原来的编号。</p><div class="actions"><button id="cancelMerge" class="quiet">取消</button><button id="confirmMerge" class="primary">确认合并</button></div></dialog>
<dialog id="categoryDialog"><form id="categoryForm" method="dialog"><h2 id="categoryTitle">添加分类</h2><label>名称<input name="name" required maxlength="20"></label><label>父分类<select name="parentId"></select></label><label>颜色<input name="color" type="color" value="#3878a8"></label><p id="categoryError" class="error" role="alert"></p><div class="actions"><button type="button" id="cancelCategory" class="quiet">取消</button><button type="submit" class="primary">保存分类</button></div></form></dialog>
<dialog id="clock" aria-label="进行中时钟"><div class="clock-shell"><div class="clock-header"><button id="closeClock" class="quiet">返回时间线</button><span>专注中</span><button id="toggleClockFocus" class="quiet" aria-pressed="false">设置</button></div><p id="clockCategory" class="clock-category"></p><div class="flip-digits" aria-label="已经用时"><span id="clockHours">00</span><b>:</b><span id="clockMinutes">00</span><b>:</b><span id="clockSeconds">00</span></div><p id="clockEnd" class="clock-end"></p><div id="clockEstimate" class="clock-estimate"></div><p id="clockStart" class="clock-sub"></p><p id="clockNote" class="clock-note"></p><section class="clock-settings-panel" aria-label="专注设置"><h3>专注设置</h3><p>屏幕</p><div class="clock-display-controls" role="group" aria-label="专注屏幕设置"><button id="toggleClockAwake" type="button" aria-pressed="true">亮屏中</button><button id="toggleClockLandscape" type="button" aria-pressed="false">切换横屏</button><button id="toggleClockFullscreen" type="button" aria-pressed="true">全屏中</button></div><p id="clockDisplayStatus" class="clock-display-status" role="status" aria-live="polite"></p><div class="estimate-form"><p>预计时间（时 / 分 / 秒）</p><div><input id="estimateHours" type="number" min="0" max="999" placeholder="时" aria-label="预计小时"><input id="estimateMinutes" type="number" min="0" max="59" placeholder="分" aria-label="预计分钟"><input id="estimateSeconds" type="number" min="0" max="59" placeholder="秒" aria-label="预计秒"></div><button id="saveEstimate" class="quiet">保存预计时间</button><button id="clearEstimate" class="quiet">清除</button></div></section><div class="clock-actions"><button id="noteFromClock" class="quiet">记下这段的想法</button><button id="stopFromClock" class="clock-stop">完成这段</button></div></div></dialog>
<dialog id="importPreview"><h2>导入前核对</h2><div id="importSummary"></div><p id="importError" class="error" role="alert"></p><div class="actions"><button id="cancelImport" class="quiet">取消</button><button id="confirmImport" class="primary">替换当前设备记录</button></div></dialog>
<dialog id="flomoDialog"><h2>传递到 Flomo</h2><p class="meta">先核对要传递的文字。直接发送会把这段内容提交给 Flomo。</p><label>发送内容<textarea id="flomoContent" rows="8" maxlength="5000"></textarea></label><p id="flomoResult" role="status"></p><div class="actions"><button id="cancelFlomo" class="quiet">取消</button><button id="openFlomoDraft">打开草稿／复制</button><button id="sendFlomo" class="primary">直接发送</button></div></dialog>
<script src="vendor/xlsx.full.min.js"></script><script type="module" src="app.mjs?v=45"></script></body></html>
