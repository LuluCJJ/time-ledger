apply plugin: 'com.android.application'

def releaseSigning = [
    keystore: System.getenv('TIME_LEDGER_KEYSTORE'),
    storePassword: System.getenv('TIME_LEDGER_STORE_PASSWORD'),
    keyAlias: System.getenv('TIME_LEDGER_KEY_ALIAS'),
    keyPassword: System.getenv('TIME_LEDGER_KEY_PASSWORD')
]
def suppliedSigningValues = releaseSigning.values().count { it != null && !it.isBlank() }
def releaseSigningReady = suppliedSigningValues == releaseSigning.size()
def releaseIdSuffix = System.getenv('TIME_LEDGER_RELEASE_ID_SUFFIX')
def releaseAppLabel = System.getenv('TIME_LEDGER_RELEASE_APP_LABEL')
if (releaseIdSuffix != null && !(releaseIdSuffix ==~ /\.[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)*/)) {
    throw new GradleException('TIME_LEDGER_RELEASE_ID_SUFFIX must contain lowercase Android application ID segments, for example .formal')
}
if (releaseIdSuffix != null && (releaseAppLabel == null || releaseAppLabel.isBlank())) {
    throw new GradleException('A side-by-side release requires TIME_LEDGER_RELEASE_APP_LABEL so the two phone icons can be distinguished')
}
if (releaseAppLabel != null && (releaseAppLabel.isBlank() || releaseAppLabel.length() > 30 || releaseAppLabel.contains('\n'))) {
    throw new GradleException('TIME_LEDGER_RELEASE_APP_LABEL must be a single nonblank line of at most 30 characters')
}

android {
    namespace = "app.personal.timeledger"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "app.personal.timeledger"
        manifestPlaceholders = [timeLedgerAppLabel: '@string/app_name']
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (releaseSigningReady) {
                storeFile file(releaseSigning.keystore)
                storePassword releaseSigning.storePassword
                keyAlias releaseSigning.keyAlias
                keyPassword releaseSigning.keyPassword
            }
        }
    }
    buildTypes {
        release {
            if (releaseIdSuffix != null) applicationIdSuffix releaseIdSuffix
            if (releaseAppLabel != null) manifestPlaceholders.timeLedgerAppLabel = releaseAppLabel
            if (releaseSigningReady) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

if (suppliedSigningValues > 0 && !releaseSigningReady) {
    throw new GradleException('Release signing requires all four TIME_LEDGER_* environment variables')
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
