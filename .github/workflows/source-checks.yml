name: Source checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: node scripts/verify-source.mjs
      - name: Check debug-backup helper with fixture data
        run: python3 -m unittest scripts/test_backup_debug_android.py
      - name: Install locked build dependencies
        run: npm ci --ignore-scripts
        working-directory: shells
      - name: Audit locked build dependencies
        run: npm audit --audit-level=moderate
        working-directory: shells

  desktop-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install locked desktop dependencies
        run: npm ci
        working-directory: shells
      - name: Build and verify Windows package
        run: npm run desktop:package
        working-directory: shells
